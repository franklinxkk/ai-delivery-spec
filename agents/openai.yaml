interface:
  display_name: "AI Delivery Spec｜需求交付规范"
  short_description: "Requirements to delivery｜需求到交付"
  default_prompt: >
    Use $ai-delivery-spec for this requirement or prototype task, follow the
    user's language, enter at the current stage, deliver only the smallest
    complete requested artifact, mark unknowns, and stop at the target. / 使用
    $ai-delivery-spec 处理本次需求或原型任务，跟随用户语言，从当前阶段进入，
    只交付最小完整的目标产物，标明未知项并在目标处停止。

inputs:
  entry_stage:
    enum: ["auto", "frame", "explore", "intake", "clarify", "specify", "review", "baseline", "change", "acceptance"]
    default: "auto"
  target_stage:
    enum: ["auto", "frame", "explore", "intake", "clarify", "specify", "review", "baseline", "change", "acceptance"]
    default: "auto"
  artifact_type:
    enum: ["problem_brief", "solution_sketch", "intake", "requirement_brief", "unified_prd", "prototype", "review", "baseline", "change", "traceability", "acceptance"]
  projection:
    enum: ["unified_prd", "requirement_card", "prototype", "qa_acceptance", "customer_contract", "machine_annex"]
    default: "unified_prd"
  delivery_tier:
    enum: ["L0", "L1", "L2", "L3", "L4"]
  delivery_shape:
    enum: ["auto", "requirement_card", "unified_prd", "governed_truth"]
  assurance_profile:
    enum: ["auto", "bounded", "standard", "high_risk", "safety_critical"]

outputs:
  required_final_fields:
    - intake_decision
    - requirement_stage
    - artifact_scope
    - mode_and_tier
    - triggered_gates
    - updated_artifacts
    - verification
    - completion_state

policy:
  allow_implicit_invocation: true
