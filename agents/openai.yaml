interface:
  display_name: "AI Delivery Spec｜需求管理内核"
  short_description: "Requirement management for human & AI｜人机共用需求管理"
  default_prompt: >
    Use $ai-delivery-spec to enter this requirement task at its current stage,
    whether it starts from an idea, problem, artifact, change, or acceptance;
    follow the user's language, deliver the smallest complete target, mark
    unknowns, and stop there. / 使用 $ai-delivery-spec 从想法、问题、现有产物、
    变更或验收的当前阶段进入，跟随用户语言，交付最小完整目标，标明未知项并停止。

inputs:
  entry_stage:
    enum: ["auto", "frame", "explore", "intake", "clarify", "specify", "review", "baseline", "change", "acceptance"]
    default: "auto"
  target_stage:
    enum: ["auto", "frame", "explore", "intake", "clarify", "specify", "review", "baseline", "change", "acceptance"]
    default: "auto"
  artifact_type:
    enum: ["problem_brief", "solution_sketch", "intake", "requirement_brief", "unified_prd", "prototype", "review", "baseline", "change", "traceability", "acceptance"]
  projection:
    enum: ["unified_prd", "requirement_card", "prototype", "qa_acceptance", "customer_contract", "machine_annex"]
    default: "unified_prd"
  delivery_tier:
    enum: ["L0", "L1", "L2", "L3", "L4"]
  delivery_shape:
    enum: ["auto", "requirement_card", "unified_prd", "governed_truth"]
  assurance_profile:
    enum: ["auto", "bounded", "standard", "high_risk", "safety_critical"]

outputs:
  required_final_fields:
    - intake_decision
    - requirement_stage
    - artifact_scope
    - mode_and_tier
    - triggered_gates
    - updated_artifacts
    - verification
    - completion_state

policy:
  allow_implicit_invocation: true
