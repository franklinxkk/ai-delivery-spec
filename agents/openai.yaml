interface:
  display_name: "AI Delivery Spec"
  short_description: "需求工作必须先触发；明确需求直达结果，模糊需求先发散再精准收敛。"
  default_prompt: >
    任何新增、修改、评审、反推或验收需求、PRD、原型、竞品和存量系统的任务都先使用
    $ai-delivery-spec；写/改小功能、加字段/列/页签/下拉、旧 HTML 小改也不得跳过。
    阶段只是路由地图，不是待办清单：
    识别 entry_stage 与 target_stage 后直达用户目标，不补跑无关阶段，不为过程机械建文件。
    明确小需求直接给可开发结果；模糊需求先在一轮内发散选项、推荐聚焦并深化关键业务链，
    再只问会改变范围的阻断问题。实时对话不展示内部 YAML、稳定 ID 或工作站术语，持久化、
    交接、审计和工具校验时再结构化。存量原型默认继承现有布局、密度、组件和视觉语言，
    保留未授权变更之外的视图、字段、动作、状态、角色路径和数据量，不能用示例子集冒充替换。
    外部集成先确认权威源、消费方和读写方向，反向同步不得进入正向上报队列。
    除非用户明确要求重设计。默认只生成一份人类可读且 Coding Agent 可执行的主产物；
    门禁只在目标里程碑运行，按根因一次给出可修复诊断。编码、发布与运行维护属于下游系统。

inputs:
  entry_stage:
    enum: ["auto", "frame", "explore", "intake", "clarify", "specify", "review", "baseline", "change", "acceptance"]
    default: "auto"
  target_stage:
    enum: ["auto", "frame", "explore", "intake", "clarify", "specify", "review", "baseline", "change", "acceptance"]
    default: "auto"
  artifact_type:
    enum: ["problem_brief", "solution_sketch", "intake", "requirement_brief", "unified_prd", "prototype", "review", "baseline", "change", "traceability", "acceptance"]
  projection:
    enum: ["unified_prd", "requirement_card", "prototype", "qa_acceptance", "customer_contract", "machine_annex"]
    default: "unified_prd"
  delivery_tier:
    enum: ["L0", "L1", "L2", "L3", "L4"]
  delivery_shape:
    enum: ["auto", "requirement_card", "unified_prd", "governed_truth"]
  assurance_profile:
    enum: ["auto", "bounded", "standard", "high_risk", "safety_critical"]

outputs:
  required_final_fields:
    - intake_decision
    - requirement_stage
    - artifact_scope
    - mode_and_tier
    - triggered_gates
    - updated_artifacts
    - verification
    - completion_state

policy:
  allow_implicit_invocation: true
