<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Delivery Spec 从存量原型到可实施评审基线的演示</title>
  <desc id="desc">用户给出存量数据上报原型后，Skill 完成盘点、规则收敛、双态原型、开发交接与诚实门禁。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#102b4b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020817" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1280" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="42" cy="40" r="7" fill="#ff6b6b"/><circle cx="66" cy="40" r="7" fill="#ffd166"/><circle cx="90" cy="40" r="7" fill="#36d399"/>
  <text x="112" y="46" fill="#a8bdd4" font-family="Consolas,Microsoft YaHei,sans-serif" font-size="17">AI Delivery Spec · real brownfield handoff</text>

  <rect x="32" y="78" width="1216" height="100" rx="18" fill="#132943" stroke="#294a6b"/>
  <text x="58" y="110" fill="#70b7ff" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700">YOU / 用户</text>
  <text x="58" y="143" fill="#f4f8fc" font-family="Microsoft YaHei,sans-serif" font-size="22">“这是已定稿的数据上报原型。做成前后端、测试能直接实现和验收的评审基线。”</text>

  <g filter="url(#shadow)">
    <rect x="32" y="204" width="286" height="324" rx="20" fill="#f7fbff"/>
    <rect x="337" y="204" width="286" height="324" rx="20" fill="#f7fbff"/>
    <rect x="642" y="204" width="286" height="324" rx="20" fill="#f7fbff"/>
    <rect x="947" y="204" width="301" height="324" rx="20" fill="#f7fbff"/>
  </g>

  <g font-family="Microsoft YaHei,sans-serif">
    <text x="56" y="242" fill="#155eef" font-size="15" font-weight="700">01 · STAGE 0 盘点</text>
    <text x="56" y="278" fill="#132238" font-size="21" font-weight="700">先读真实系统</text>
    <text x="56" y="312" fill="#526579" font-size="15">页面 · 角色 · 动作 · 状态</text>
    <text x="56" y="338" fill="#526579" font-size="15">字段 · 指标 · 数据源 · 缺口</text>
    <rect x="56" y="375" width="226" height="82" rx="12" fill="#eaf2ff"/>
    <text x="72" y="405" fill="#294661" font-size="14">保留存量入口与视觉权威</text>
    <text x="72" y="432" fill="#294661" font-size="14">不把推断伪装成现状</text>

    <text x="361" y="242" fill="#155eef" font-size="15" font-weight="700">02 · STEP 实施合同</text>
    <text x="361" y="278" fill="#132238" font-size="21" font-weight="700">把口头澄清变规则</text>
    <text x="361" y="312" fill="#526579" font-size="15">入口 / 权限 / 权威源回写</text>
    <text x="361" y="338" fill="#526579" font-size="15">计数口径 / 日志粒度 / 状态</text>
    <rect x="361" y="375" width="226" height="82" rx="12" fill="#eaf2ff"/>
    <text x="377" y="405" fill="#294661" font-size="14">成功、失败、部分成功</text>
    <text x="377" y="432" fill="#294661" font-size="14">下一责任人与可达入口</text>

    <text x="666" y="242" fill="#155eef" font-size="15" font-weight="700">03 · 双态原型</text>
    <text x="666" y="278" fill="#132238" font-size="21" font-weight="700">一份业务 DOM</text>
    <text x="666" y="312" fill="#526579" font-size="15">产品态：客户确认与操作</text>
    <text x="666" y="338" fill="#526579" font-size="15">评审态：编号 + 角色镜头</text>
    <rect x="666" y="375" width="226" height="82" rx="12" fill="#eaf2ff"/>
    <text x="682" y="405" fill="#294661" font-size="14">评审态只在明确要求时出现</text>
    <text x="682" y="432" fill="#294661" font-size="14">不把整份 PRD 塞进抽屉</text>

    <text x="971" y="242" fill="#155eef" font-size="15" font-weight="700">04 · HANDOFF + GATE</text>
    <text x="971" y="278" fill="#132238" font-size="21" font-weight="700">能开工，也不假装证明</text>
    <text x="971" y="312" fill="#526579" font-size="15">稳定 ID · AC · 失败恢复</text>
    <text x="971" y="338" fill="#526579" font-size="15">前端 / 后端 / 测试复述检查</text>
    <rect x="971" y="375" width="241" height="82" rx="12" fill="#fff1e8"/>
    <text x="987" y="405" fill="#8a431e" font-size="14">PASS ≠ 已实现或已验收</text>
    <text x="987" y="432" fill="#8a431e" font-size="14">P0 未知项仍会阻断基线</text>
  </g>

  <path d="M318 366h19M623 366h19M928 366h19" stroke="#65a9ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M331 359l8 7-8 7M636 359l8 7-8 7M941 359l8 7-8 7" fill="none" stroke="#65a9ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="574" fill="#c4d5e7" font-family="Microsoft YaHei,sans-serif" font-size="17">OUTPUT / 输出：统一 PRD · 可操作 HTML · STEP-* · 结构化交接 · ARUN-* 验收证据</text>
</svg>
