    type: "{观察对象类型}"
    source_ref: SRC-PROJECT-001
    source_location: "{实际文件与位置}"
    classification: unknown
# 实际观察后再填 action → 处理 → 输出 → 下一入口/守卫，以及失败、退回、重试与补偿。
