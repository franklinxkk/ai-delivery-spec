schema_version: 5.1.0
run_id: ARUN-CORE-001
baseline_version: "1.0"
environment: "{acceptance environment}"
executor: "{executor}"
executed_at: "2026-01-01T00:00:00Z"
evidence_catalog:
  - id: EVD-CORE-001
    uri: https://example.invalid/evidence/EVD-CORE-001
# pass 时先登记：{id: EVD-CORE-001, uri: evidence/AC-CORE-001.png, sha256: 可选}
items:
  - id: ARITEM-CORE-001
    acceptance_ref: AC-CORE-001
    requirement_refs: [REQ-CORE-001]
    mandatory: true
    result: not_run
    actual_result: ""
    evidence_refs: []
    defect_refs: []
# residual_issues 为对象数组；每项必填 id/description/owner/disposition，
# disposition ∈ fix_before_acceptance | accepted_risk | deferred | rejected。
residual_issues:
  - id: DEFECT-CORE-001
    description: "{residual issue}"
    owner: "{owner}"
    disposition: deferred
    due_criterion: "{closure criterion}"
conclusion: pending
# conditions 为对象数组；每项必填 description/owner/due_criterion。
conditions:
  - description: "{acceptance condition}"
    owner: "{owner}"
    due_criterion: "{due criterion}"
# sign_offs 为对象数组；每项必填 role/actor/decision/at，
# decision ∈ approve | approve_with_conditions | reject。
sign_offs:
  - role: 客户验收人
    actor: "{actor}"
    decision: approve
    at: "2026-01-01T00:00:00Z"
    evidence_ref: EVD-CORE-001
# accepted 时每条签署必须填写 evidence_ref，并能解析到 evidence_catalog 或本地相对路径。
