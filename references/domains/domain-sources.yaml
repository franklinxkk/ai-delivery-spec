schema_version: 5.4.5
last_catalog_review: 2026-08-10
policy:
  primary_sources_only_for_binding_claims: true
  model_memory_is_authority: false
  copy_full_protected_standard: false
  draft_can_create_hard_stop_rule: false
  product_pattern_can_create_requirement: false
  change_watch_can_create_hard_stop_rule: false
  project_applicability_must_be_rechecked: true
  refresh_high_risk_days: 90
  refresh_normal_days: 180
  effect_classes:
    binding_baseline: Current law, effective rule, standard, or official policy that may constrain a project after jurisdiction and applicability are verified.
    design_guidance: Authoritative guidance or standard that improves design but is not automatically mandatory for every project.
    product_pattern: Official product, project, case, or vendor evidence used only to discover options and implementation patterns.
    change_watch: Draft, roadmap, market signal, inaccessible internal reference, or announced transition that triggers re-verification but never a hard requirement.

