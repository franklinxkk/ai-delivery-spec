<!doctype html>
<!-- Browser-only interaction fixture. Deterministic manifest/schema coverage is generated by
     maintainer/tests/test_v547_review_workspace.py; this file is not a handoff artifact. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>5.4.7 Final Review Runtime</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 390px; color: #172033; background: #f5f7fb; font: 14px system-ui; }
    .product { padding: 24px; }
    .card, .review { background: #fff; border: 1px solid #dce2ee; }
    .card { max-width: 760px; padding: 20px; border-radius: 12px; }
    .toolbar, .tabs { display: flex; gap: 8px; margin: 12px 0; }
    .status { padding: 10px; background: #f2f6ff; }
    .marker { width: 28px; height: 28px; border: 0; border-radius: 50%; color: #fff; background: #5b5df0; }
    [data-review-target-selected="true"] { outline: 3px solid #ff4dc4; outline-offset: 3px; }
    .review { min-width: 0; padding: 16px; border-width: 0 0 0 1px; z-index: 10; }
    .tab[hidden], .drawer[hidden], .point[hidden] { display: none; }
    .review-expand { display: none; position: fixed; right: 16px; top: 16px; z-index: 50; }
    body.review-collapsed { grid-template-columns: minmax(0, 1fr); }
    body.review-collapsed .review { display: none; }
    body.review-collapsed .review-expand { display: block; }
    .tabs button { flex: 1; }
    .point { margin: 10px 0; padding: 12px; border: 1px solid #dce2ee; border-radius: 10px; }
    .point.selected { border-color: #5b5df0; box-shadow: 0 0 0 2px #e9e8ff; }
    .drawer { position: fixed; top: 0; right: 390px; bottom: 0; width: 420px; padding: 20px; background: #fff; border-left: 1px solid #cdd5e5; box-shadow: -10px 0 30px #1b2a4a26; z-index: 30; }
    .review-fullscreen { grid-template-columns: 1fr; }
    .review-fullscreen .product { display: none; }
    @media (max-width: 700px) { body { display: block; } .review { display: none; } .review-fullscreen .review { display: block; } .drawer { right: 0; width: 100%; } }
  </style>
</head>
<body>
  <section class="product" data-product-root>
    <main class="card" data-testid="page-VIEW-RECORD" data-review-context-root="VIEW-RECORD" data-review-context-type="VIEW">
      <h1>记录管理</h1>
      <p>产品自身操作决定评审上下文。</p>
      <label>记录名称 <input value="示例记录"></label>
      <div class="toolbar">
        <button data-action="ACT-SAVE">保存记录</button>
        <button data-action="ACT-OPEN">打开确认抽屉</button>
        <button data-action="UIACT-REVIEW-COMPACT">查看评审说明</button>
        <button class="marker" data-action="UIACT-REVIEW-SELECT" data-review-ref="RP-VIEW-SAVE" data-review-context="VIEW-RECORD" data-review-number="1" aria-current="false">1</button>
      </div>
      <div class="status" data-business-state="editing">状态：编辑中</div>
    </main>
  </section>

  <section class="drawer" hidden data-review-context-root="DRAWER-CONFIRM" data-review-context-type="DRAWER">
    <h2>确认变更</h2>
    <p>这是产品业务抽屉，层级高于评审区。</p>
    <button data-action="ACT-CONFIRM">确认提交</button>
    <button data-action="ACT-CLOSE">关闭抽屉</button>
    <button class="marker" data-action="UIACT-REVIEW-SELECT" data-review-ref="RP-DRAWER-CONFIRM" data-review-context="DRAWER-CONFIRM" data-review-number="1" aria-current="false">1</button>
  </section>

  <button class="review-expand" data-action="UIACT-REVIEW-TOGGLE" data-ads-act="expand">展开评审</button>

  <aside class="review" data-review-workspace="REVIEW-RUNTIME" data-review-level="R1" data-review-active-tab="overview" data-review-current-context="VIEW-RECORD" data-review-current-context-control="read-only" data-review-layout="participate-in-layout" data-review-overlay-product-ui="false" data-review-resizable="true" data-review-collapsible="true">
    <header>
      <strong>评审说明</strong>
      <p>当前上下文：<span data-current-label>记录管理</span></p>
      <div class="tabs">
        <button data-action="UIACT-REVIEW-TAB" data-review-tab-target="overview">总览</button>
        <button data-action="UIACT-REVIEW-TAB" data-review-tab-target="function_flow">功能与流转</button>
        <button data-action="UIACT-REVIEW-TAB" data-review-tab-target="boundary_acceptance">边界与验收</button>
      </div>
    </header>
    <section class="tab" data-review-tab="overview">
      <h2>总览</h2>
      <p>目标：保存记录并在需要时完成确认。</p>
      <p>主链：记录页 → 确认抽屉 → 返回记录页。</p>
    </section>
    <section class="tab" hidden data-review-tab="function_flow">
      <h2>功能与流转</h2>
      <article class="point" data-action="UIACT-REVIEW-SELECT" data-review-point="RP-VIEW-SAVE" data-review-context="VIEW-RECORD" data-review-number="1" aria-current="false">
        <button data-action="UIACT-REVIEW-SELECT">1 保存记录</button>
        <p>输入当前表单，保存后原页显示持久结果；失败保留输入。</p>
      </article>
      <article class="point" hidden data-action="UIACT-REVIEW-SELECT" data-review-point="RP-DRAWER-CONFIRM" data-review-context="DRAWER-CONFIRM" data-review-number="1" aria-current="false">
        <button data-action="UIACT-REVIEW-SELECT">1 确认提交</button>
        <p>确认后提交业务状态，关闭后回到父级记录页。</p>
      </article>
    </section>
    <section class="tab" hidden data-review-tab="boundary_acceptance">
      <h2>边界与验收</h2>
      <p>重复提交只产生一次业务结果；关闭不提交；无权用户看不到产品入口。</p>
    </section>
    <footer>
      <button data-action="UIACT-REVIEW-RECORD">确认本上下文</button>
      <button data-action="UIACT-REVIEW-SHARE">复制定位</button>
      <button data-action="UIACT-REVIEW-TOGGLE" data-ads-act="collapse">收起</button>
      <button data-action="UIACT-REVIEW-COMPACT">产品/评审全屏</button>
      <span data-review-progress>0/2</span>
      <span data-invariant>未执行</span>
    </footer>
  </aside>

  <script>
    const productState = { activeView: "VIEW-RECORD", route: "records", overlayStack: [], selectedBusinessObject: "REC-1", businessState: "editing" };
    const reviewState = { tab: "overview", point: null, records: {} };
    function captureProductFingerprint() { const input = document.querySelector("input"); return JSON.stringify({ ...productState, form: input.value, checked: input.checked, disabled: input.disabled }); }
    function captureReviewFingerprint() { return JSON.stringify(reviewState); }
    function assertProductFingerprintInvariant(before, after) { const ok = before === after; document.querySelector("[data-invariant]").textContent = ok ? "产品指纹未变化" : "产品指纹已变化"; if (!ok) throw new Error("product changed"); }
    function runReviewAction(fn) { const before = captureProductFingerprint(); fn(); const after = captureProductFingerprint(); assertProductFingerprintInvariant(before, after); captureReviewFingerprint(); }
    function isTargetVisible(node) { return Boolean(node.offsetWidth || node.offsetHeight || node.getClientRects().length); }
    function currentContextRoot() { return document.querySelector("[data-review-context-root='" + document.querySelector(".review").dataset.reviewCurrentContext + "']"); }
    function exactlyOne(nodes) { if (nodes.length !== 1) throw new Error("target cardinality"); return nodes[0]; }
    function pointTarget(ref) { return ref === "RP-VIEW-SAVE" ? "[data-action=ACT-SAVE]" : "[data-action=ACT-CONFIRM]"; }
    function resolveReviewTarget(ref) { return exactlyOne([...currentContextRoot().querySelectorAll(pointTarget(ref))].filter(isTargetVisible)); }
    function focusReviewTarget(ref) { document.querySelectorAll("[data-review-target-selected]").forEach(node => node.removeAttribute("data-review-target-selected")); document.querySelectorAll("[data-review-ref],[data-review-point]").forEach(node => node.setAttribute("aria-current", String((node.dataset.reviewRef || node.dataset.reviewPoint) === ref))); resolveReviewTarget(ref).setAttribute("data-review-target-selected", "true"); }
    function renderContext() { const context = productState.overlayStack.at(-1) || productState.activeView; const review = document.querySelector(".review"); review.dataset.reviewCurrentContext = context; document.querySelector("[data-current-label]").textContent = context === "VIEW-RECORD" ? "记录管理" : "确认变更"; document.querySelectorAll("[data-review-point]").forEach(node => { node.hidden = node.dataset.reviewContext !== context; }); }
    function resolveCurrentContext() { renderContext(); return document.querySelector(".review").dataset.reviewCurrentContext; }
    window.addEventListener("product-context-change", resolveCurrentContext);
    new MutationObserver(() => resolveCurrentContext()).observe(document.querySelector(".drawer"), { attributes: true });
    const productActions = {
      "ACT-SAVE": () => { productState.businessState = "saved"; const status = document.querySelector("[data-business-state]"); status.textContent = "状态：已保存"; status.dataset.businessState = "saved"; },
      "ACT-OPEN": () => { document.querySelector(".drawer").hidden = false; productState.overlayStack.push("DRAWER-CONFIRM"); window.dispatchEvent(new Event("product-context-change")); },
      "ACT-CONFIRM": () => { productState.businessState = "confirmed"; const status = document.querySelector("[data-business-state]"); status.textContent = "状态：已确认"; status.dataset.businessState = "confirmed"; },
      "ACT-CLOSE": () => { document.querySelector(".drawer").hidden = true; productState.overlayStack.pop(); window.dispatchEvent(new Event("product-context-change")); }
    };
    const reviewActions = {
      "UIACT-REVIEW-TAB": node => { reviewState.tab = node.dataset.reviewTabTarget; document.querySelector(".review").dataset.reviewActiveTab = reviewState.tab; document.querySelectorAll("[data-review-tab]").forEach(tab => { tab.hidden = tab.dataset.reviewTab !== reviewState.tab; }); },
      "UIACT-REVIEW-SELECT": node => { const card = node.closest("[data-review-point]"); const ref = node.dataset.reviewRef || (card && card.dataset.reviewPoint); reviewState.point = ref; document.querySelectorAll(".point").forEach(item => item.classList.toggle("selected", item.dataset.reviewPoint === ref)); focusReviewTarget(ref); },
      "UIACT-REVIEW-RECORD": () => { const context = resolveCurrentContext(); reviewState.records[context] = "confirmed"; localStorage.setItem("review:baseline-1", JSON.stringify(reviewState.records)); document.querySelector("[data-review-progress]").textContent = Object.keys(reviewState.records).length + "/2"; },
      "UIACT-REVIEW-SHARE": () => { const params = new URLSearchParams({ baseline_ref: "baseline-1", context_ref: resolveCurrentContext(), review_point_ref: reviewState.point || "", active_tab: reviewState.tab }); location.hash = params.toString(); },
      "UIACT-REVIEW-TOGGLE": node => document.body.classList.toggle("review-collapsed", node.dataset.adsAct === "collapse"),
      "UIACT-REVIEW-COMPACT": () => document.body.classList.toggle("review-fullscreen")
    };
    document.addEventListener("click", event => { const node = event.target.closest("[data-action]"); if (!node) return; const id = node.dataset.action; if (productActions[id]) productActions[id](); else if (reviewActions[id]) runReviewAction(() => reviewActions[id](node)); });
    reviewState.records = JSON.parse(localStorage.getItem("review:baseline-1") || "{}");
    document.querySelector("[data-review-progress]").textContent = Object.keys(reviewState.records).length + "/2";
    renderContext();
  </script>
</body>
</html>
