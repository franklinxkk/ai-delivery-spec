known_limitations:
- This round uses bounded synthetic inputs. Both final DeepSeek prototype artifacts
  include GPT-6.1-sol assistance; initial warning paths passed but later evidence
  exposed impossible acceptance setup and swallowed persistence errors. Metric prototype
  did not close independently. Fault injection is controlled browser evidence, not
  real backend acceptance. Unequal harnesses are not a strict model benchmark.
- 5.5.6 one-scenario comparison is not strictly blind. Single-run quick receiver tests
  and project calibration do not establish stable benefit or human handoff quality.
  Not all 101 sources were reread; 18 stale records were resolved within their documented
  scope.
- 5.5.4 behavior observed in two synthetic tasks only; no controlled comparative or
  human receiver study.
- Earlier three-task comparison receiver scoring stopped at host quota; its parent
  review is not blind. The later domain-stage run is separately recorded with independent
  inputs and parent adjudication.
- Single-run synthetic forward calibration does not establish stable benefit or human
  handoff quality
- CRM native outputs and assisted repairs are separate; one case does not establish
  cross-model stability
- Contract tests and bounded candidate-review behavior do not prove full-generation,
  expert or production maturity
- domain, legal, safety, financial, production and customer correctness remain not
  proven
