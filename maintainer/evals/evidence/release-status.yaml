known_limitations:
- five domain methods have owner-attested production practice; all built-in packs
  pass deterministic contract checks but fresh-agent/expert maturity remains separate
- v5.4.7 review-workspace and adversarial contract probes are deterministic; one isolated
  no-skill cold-read is recorded separately, while fresh-agent repetitions, real receiver
  handoff and versioned user feedback remain incomplete
- domain expert, customer, production, legal, safety, and financial correctness are
  not proven
- deterministic fixtures and private brownfield calibration expose method gaps but
  do not prove implementation or customer acceptance
