schema_version: 5.4.7
portfolio_id: PORT-CAPABILITY-CROSS-DOMAIN
name: 跨领域需求能力组合夹具
purpose: 用不同需求物理证明方法能按风险选择必要合同与接收者，不要求每个项目、阶段或角色机械跑满。

claim_boundary:
  execution_status: contract_fixture
  simulated_review_is_expert_review: false
  official_source_is_project_requirement: false
  production_claim: prohibited
  statement: 本夹具只证明结构与负例覆盖，不证明领域正确、真人冷读、实现完成或客户验收。

selection_policy:
  unit: requirement_physics
  rule: 新场景只有在引入未覆盖的状态、权威、金额、安全、隐私、离线、AI写回或验收风险时才加入。
  project_rule: 每个真实项目重新确认地域、版本、责任主体、来源优先级和客户决定。

execution_model:
  scope: offline_release_hardening
  runtime_prerequisite: false
  isolation: 每个候选只读同一输入、适用方法切片和自己的输出；隐藏金标与其他候选不可见。
  comparison:
    preregistered: true
    same_model_permissions_context: true
    repeated_runs_per_arm_scenario: 3
    minimum_real_project_families: 3
    blind_scoring_before_unblind: true
    required_metrics: [freeze_time, p0_omission, developer_clarifications, rework, qa_reproduction, tokens, final_quality]
  finding_contract:
    required: [id, lens, severity, affected_ids, evidence_refs, gap, owner, close_when]
    max_findings_per_lens_scenario: 5
    majority_can_override_authority_or_safety_blocker: false

runtime_goalkeeper:
  llm_calls: 0
  subagent_calls: 0
  generates_or_fixes_requirements: false
  artifact_parse_passes: 1
  default_behavior: P0 fail-fast then compact root-cause summary

risk_lenses:
  business_product:
    trigger: 目标、范围、角色旅程、指标或批准事实改变
    must_answer: [业务结果, 范围边界, 决策权威, 未知项]
  domain:
    trigger: 领域状态、不变量、法规合同或专业术语影响正确性
    must_answer: [实体生命周期, 规则来源, 例外, 责任专家]
  ux:
    trigger: 页面入口、跨端旅程、可见状态或恢复路径改变
    must_answer: [入口, 可见结果, 全状态, 可恢复动作]
  frontend:
    trigger: 交互、字段、角色可见性、并发反馈或存量回归改变
    must_answer: [触发动作, 前置守卫, 响应事件, UI状态]
  backend:
    trigger: 数据权威、状态转换、金额、事件、集成或幂等改变
    must_answer: [权威源, 处理规则, 事务副作用, 错误恢复]
  qa:
    trigger: 任一可观察业务行为需要独立复现
    must_answer: [正向, 反向, 边界, 权限并发, 证据]
  compliance_safety:
    trigger: 隐私、安全、法规、不可逆决策或高影响AI写回
    must_answer: [合法权限, 最小数据, 人工责任, 审计与救济]

artifact_contracts:
  human_baseline:
    required: [目标范围, 角色旅程, 适用流程状态数据流, 规则异常, 未知项, 验收]
  review_projection:
    conditional: 仅在用户要求或首次开发移交确认后
    required: [导读, 旅程, 原子步骤, 受影响角色工作包, 证据入口]
  machine_handoff:
    conditional: Coding Agent 或结构化交接进入范围
    required: [baseline_hash, stable_refs, states_rules_errors, acceptance_refs, not_proven]

downstream_consumer_probes:
  product:
    ready_when: 未参与原讨论者能复述目标、边界、主链、例外和开放决定
    forbidden: 用内部ID或工程附录替代业务主线
  frontend:
    ready_when: 可从入口和动作还原字段、状态、权限、反馈和恢复
    forbidden: 自行发明状态、字段或成功结果
  backend:
    ready_when: 可还原权威、守卫、事务、幂等、事件、错误和审计
    forbidden: 用数据库或框架设计替代业务决定
  qa:
    ready_when: 可独立导出并执行正反边界权限并发回归路径
    forbidden: 从页面或接口存在推断业务正确
  coding_agent:
    ready_when: 稳定引用闭合且缺语义时返回 GAP
    forbidden: 从评审右栏猜规则或把实现完成冒充验收

scenarios:
  - id: CAP-CRM-MONEY-STATE
    sector: crm
    requirement_physics: [money, guarded_state, role_permission, idempotent_side_effect, traceability]
    required_lenses: [business_product, frontend, backend, qa]
    p0_seed: 赢单、合同和回款的状态词冲突且事务边界未知
    mutation_probe: 大额合同新增法务复核但低金额路径不变
  - id: CAP-TRAFFIC-EXTERNAL-AUTHORITY
    sector: traffic
    requirement_physics: [external_authority, bidirectional_sync, partial_success, rule_version, regulated_unknown]
    required_lenses: [business_product, domain, backend, qa, compliance_safety]
    p0_seed: 无数据、接口失败和合格被混淆，法规阈值无批准来源
    mutation_probe: 新配置仅从下一上报周期生效
  - id: CAP-EDU-VERSION-ENTITLEMENT
    sector: education-it
    requirement_physics: [published_version, approval_separation, entitlement, atomic_redemption, progress_authority]
    required_lenses: [business_product, domain, ux, frontend, backend, qa]
    p0_seed: 已发布版本可被原地修改且兑换失败会消耗次数
    mutation_probe: 下架只阻断新兑换，既有学员保留锁定版本
  - id: CAP-MEDICAL-HUMAN-AUTHORITY
    sector: medical-healthcare
    requirement_physics: [sensitive_data, clinical_authority, human_override, audit, safety]
    required_lenses: [domain, backend, qa, compliance_safety]
    p0_seed: AI建议被误写成自动临床决定
    mutation_probe: 高风险结果新增双人复核与申诉
  - id: CAP-FINANCE-RECONCILIATION
    sector: finance-insurance
    requirement_physics: [money, reconciliation, cut_off, duplicate, compensation]
    required_lenses: [business_product, domain, backend, qa, compliance_safety]
    p0_seed: 汇总金额无权威账、截止时间和对账差异处理
    mutation_probe: 跨日退款改为原交易日与结算日双视图
  - id: CAP-INDUSTRIAL-OFFLINE-ASSET
    sector: manufacturing-industrial
    requirement_physics: [offline, asset_state, device_event, conflict_merge, safety]
    required_lenses: [domain, ux, frontend, backend, qa, compliance_safety]
    p0_seed: 离线操作与设备事件并发导致资产状态回退
    mutation_probe: 网络恢复后只自动合并无冲突字段
  - id: CAP-GOV-CROSS-ORG-APPROVAL
    sector: digital-government
    requirement_physics: [cross_tenant, delegated_authority, approval, time_limit, audit]
    required_lenses: [business_product, domain, ux, backend, qa, compliance_safety]
    p0_seed: 委托权限和数据范围未区分，跨机构可见性不明确
    mutation_probe: 委托到期后保留历史可审计但禁止新操作

release_acceptance:
  - 运行时不加载本夹具且不调用模型或子Agent
  - 所有场景只启用 required_lenses，不机械补齐其他角色
  - 每个场景有 P0 负例与实质变更探针
  - 模拟与静态结果不升级为专家、实现、生产或客户证据
  - 正式最佳声明必须来自预注册、多次重复、盲评分的真实项目比较
