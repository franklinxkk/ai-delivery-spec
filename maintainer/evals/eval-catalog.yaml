schema_version: 5.0.0
claim_policy:
  structural_pass_is_behavioral_pass: false
  simulated_reviewer_is_expert_review: false
  passed_requires_evidence: true
  quantitative_metrics: maintainer/evals/metric-definitions.yaml

dimensions:
  - trigger_accuracy
  - clarification_quality
  - requirement_completeness
  - no_guess_handoff
  - cross_artifact_consistency
  - domain_accuracy
  - change_safety
  - human_usability
  - context_efficiency
  - trigger_recall
  - convergence_speed
  - overinterpretation_control
  - visual_consistency
  - validation_efficiency
  - user_satisfaction

scenarios:
  - id: EVAL-NEWCOMER-SAAS-001
    project: newcomer-saas
    lifecycle: discover
    shape: greenfield
    perspective: newcomer
    input: examples/minimal-v5/README.md
    expected:
      - ask only material clarification
      - produce a bounded Light specification
      - explain next upgrade trigger without internal jargon
    dimensions: [trigger_accuracy, clarification_quality, human_usability, context_efficiency]
    status: not_run
    evidence: []

  - id: EVAL-PUBLISHING-PM-001
    project: publishing-learning
    lifecycle: specify
    shape: brownfield
    perspective: product_owner
    input: maintainer/examples/publishing-learning-v5/delivery/truth/product-truth.yaml
    expected:
      - resource, course, authorization, activation, learning, and evidence form one readable chain
      - page and click behavior can be reviewed without blind prototype switching
      - gaps and project-specific assertions are visible
    dimensions: [requirement_completeness, cross_artifact_consistency, human_usability]
    status: partial
    evidence: [maintainer/evals/evidence/static-regression-2026-07-11.yaml]

  - id: EVAL-PUBLISHING-CODING-001
    project: publishing-learning
    lifecycle: build_verify
    shape: brownfield
    perspective: coding_agent
    input: maintainer/examples/publishing-learning-v5/delivery
    expected:
      - implement one vertical slice without inventing pages, fields, states, or rules
      - report repository conflicts instead of silently adapting business behavior
      - bind tests and evidence to AC IDs
    dimensions: [no_guess_handoff, cross_artifact_consistency, change_safety]
    status: not_run
    evidence: []

  - id: EVAL-PUBLISHING-QA-001
    project: publishing-learning
    lifecycle: build_verify
    shape: brownfield
    perspective: qa
    input: maintainer/examples/publishing-learning-v5/delivery/truth/product-truth.yaml
    expected:
      - derive happy, over-limit, duplicate activation, dependency, and idempotency tests
      - distinguish required evidence from executed evidence
    dimensions: [requirement_completeness, cross_artifact_consistency]
    status: not_run
    evidence: []

  - id: EVAL-BROWNFIELD-CHANGE-001
    project: traffic-regulatory-change
    lifecycle: change
    shape: brownfield
    perspective: product_engineering
    input: maintainer/examples/traffic-regulatory-change-v5/change-package.yaml
    expected:
      - preserve impacted stable IDs without silently losing approved behavior
      - expose unresolved evidence and approvals instead of inventing them
      - identify regression, rollout, rollback, and data migration impact
    dimensions: [change_safety, cross_artifact_consistency, no_guess_handoff]
    status: partial
    evidence: [maintainer/evals/evidence/static-regression-2026-07-11.yaml]

  - id: EVAL-TRAFFIC-REGULATED-001
    project: traffic-safety
    lifecycle: specify
    shape: hybrid
    perspective: accountable_domain_reviewer
    input: references/domains/domain-traffic.md
    expected:
      - distinguish regulator and enterprise responsibility
      - refuse unsupported legal conclusions
      - show source applicability and unresolved verification gaps
    dimensions: [domain_accuracy, requirement_completeness]
    status: partial
    evidence: [maintainer/evals/evidence/static-regression-2026-07-11.yaml]

  - id: EVAL-GENERIC-ENERGY-001
    project: energy-device-maintenance
    lifecycle: discover
    shape: brownfield
    perspective: product_owner
    input: maintainer/examples/generic-energy-capsule-v5/project-domain-capsule.yaml
    expected:
      - use generic rules instead of blocking delivery
      - build a Project Domain Capsule
      - mark safety and regulatory claims inferred or unknown until confirmed
    dimensions: [clarification_quality, requirement_completeness, domain_accuracy]
    status: partial
    evidence: [maintainer/evals/evidence/static-regression-2026-07-11.yaml]

  - id: EVAL-NEGATIVE-TRIGGER-001
    project: unrelated-debugging
    lifecycle: discover
    shape: greenfield
    perspective: routing
    input: 修复一个与产品交付无关的 Python 语法错误
    expected:
      - do not trigger ai-delivery-spec
    dimensions: [trigger_accuracy, context_efficiency]
    status: not_run
    evidence: []

  - id: EVAL-V542-CLEAR-SMALL-001
    project: enterprise-talk-status-filter
    lifecycle: specify
    shape: brownfield
    perspective: product_owner
    input: 在现有企业约谈列表增加按约谈状态筛选，状态为待发起、待反馈、已完成，产出可开发需求说明和验收标准。
    expected:
      - invoke the skill even though the feature is small and clear
      - provide a directly usable requirement slice without prerequisite artifacts
      - ask zero questions about facts already supplied
      - expose no YAML, stable IDs or workstation terminology in live dialogue
    dimensions: [trigger_recall, convergence_speed, overinterpretation_control, human_usability]
    status: not_run
    evidence: []

  - id: EVAL-V542-AMBIGUOUS-001
    project: enterprise-risk-early-idea
    lifecycle: discover
    shape: greenfield
    perspective: product_owner
    input: 我想让某交通运输企业监管平台能提前发现高风险企业，先帮我把需求想清楚。
    expected:
      - provide two or three materially different directions plus a no-build option
      - recommend one direction with reasons and tradeoffs
      - deepen the selected business loop before asking
      - ask at most one highest-impact question in the first response
      - avoid premature pages, YAML, stable IDs and governance jargon
    dimensions: [trigger_recall, clarification_quality, convergence_speed, overinterpretation_control, human_usability]
    status: not_run
    evidence: []

  - id: EVAL-V542-BROWNFIELD-PROTOTYPE-001
    project: enterprise-talk-prototype-iteration
    lifecycle: specify
    shape: brownfield
    perspective: ux_frontend
    input: 基于三份现有企业约谈 HTML 做小迭代，列表增加行业筛选，保持现有布局和组件风格，不要大改。
    expected:
      - inspect existing views, actions, handlers and visible style before changing
      - treat existing shell, density, tokens and component variants as visual authority
      - do not ask for an aesthetic direction or replace the design system
      - preserve interaction coverage and produce a project-wide visual lock
    dimensions: [trigger_recall, overinterpretation_control, visual_consistency, change_safety, human_usability]
    status: not_run
    evidence: []

  - id: EVAL-V542-GATE-ROOTS-001
    project: enterprise-talk-prd-review
    lifecycle: review
    shape: brownfield
    perspective: product_engineering
    input: 某交通监管系统_企业约谈_PRD_v1.0.md
    expected:
      - preserve every machine-readable finding in JSON
      - show every unique finding code once in default concise diagnostics
      - compact repeated findings and avoid one-finding-per-rerun repair loops
      - report the static gate claim boundary
    dimensions: [validation_efficiency, human_usability, context_efficiency]
    status: not_run
    evidence: []

  - id: EVAL-V544-EN-SMALL-TRIGGER-001
    project: crm-status-filter-en
    lifecycle: specify
    shape: brownfield
    perspective: product_owner
    input: Add an optional customer-tier filter to the existing CRM account list and give me an implementation-ready requirement with acceptance criteria.
    expected:
      - invoke ai-delivery-spec even though the request is small and clear
      - keep questions, headings, tables, diagrams, acceptance prose and gate diagnostics in English
      - preserve stable IDs, API names, field keys and machine enums without translation
      - deliver the smallest complete requirement slice without unrelated lifecycle artifacts
    dimensions: [trigger_recall, convergence_speed, overinterpretation_control, human_usability]
    status: not_run
    evidence: []

  - id: EVAL-V544-EN-REVIEW-INTENT-001
    project: crm-review-projection-en
    lifecycle: review
    shape: brownfield
    perspective: product_engineering
    input: Create a review version with numbered annotations and a review drawer for frontend, backend and QA.
    expected:
      - treat review version and numbered annotations as explicit review-projection confirmation
      - do not ask again whether review mode is needed
      - keep visible review content in English and machine handoff values unchanged
      - preserve product behavior when toggling the review projection
    dimensions: [trigger_recall, requirement_completeness, human_usability, change_safety]
    status: not_run
    evidence: []

  - id: EVAL-V544-ZH-LANGUAGE-FIDELITY-001
    project: 企业一键上报中文评审
    lifecycle: specify
    shape: brownfield
    perspective: product_owner
    input: 在现有企业数据一键上报页面增加“上次同步时间”列，保持原布局，只给产品模式和可开发验收标准。
    expected:
      - 小而明确的中文需求也必须命中 ai-delivery-spec
      - 标题、正文、表头、提问、图节点、测试与门禁诊断均使用中文
      - 不生成评审抽屉，不裸露 Given/When/Then 或机器状态标签
      - 保留现有布局、动作覆盖和未授权范围
    dimensions: [trigger_recall, convergence_speed, overinterpretation_control, visual_consistency, human_usability]
    status: not_run
    evidence: []
