schema_version: 5.3.0
# Runtime includes public usage artwork and target resolution; maintenance tests and private projects stay outside.
# 5.5.7 candidate plus the retained Chinese guide and shared trace reference resolver.
max_files: 139
include:
  - SKILL.md
  - README.md
  - CHANGELOG.md
  - LICENSE
  - agents/openai.yaml
  - examples/**
  - references/**
  - schemas/**
  - scripts/**
exclude:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/*.tmp"
  - "**/*.log"
  - "**/*.bak"
  - "**/*.backup"
