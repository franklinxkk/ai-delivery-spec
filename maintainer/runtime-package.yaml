schema_version: 5.3.0
# One additional on-demand synthetic configuration case in 5.5.4; no runtime tool/schema growth.
max_files: 119
include:
  - SKILL.md
  - README.md
  - CHANGELOG.md
  - LICENSE
  - agents/openai.yaml
  - examples/**
  - references/**
  - schemas/**
  - scripts/**
exclude:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/*.tmp"
  - "**/*.log"
  - "**/*.bak"
  - "**/*.backup"
